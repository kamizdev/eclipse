<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0f16">

  <title>Band DAW</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="app">

    <!-- HEADER -->
    <header class="topbar">

      <div>
        <div class="brand">BAND DAW</div>

        <h1 id="pageTitle">
          Archivio brani
        </h1>

        <p id="status">
          Seleziona un brano per aprire il mixer.
        </p>
      </div>

      <button
        id="backButton"
        class="button hidden"
        type="button">
        ← Brani
      </button>

    </header>


    <!-- =========================
         LIBRARY
         ========================= -->

    <section id="library">

      <div class="library-header card">

        <div>
          <h2>Brani della band</h2>

          <p id="songCount">
            Caricamento...
          </p>
        </div>

        <button
          id="refreshButton"
          class="button"
          type="button">
          ↻ Aggiorna
        </button>

      </div>


      <div
        id="songGrid"
        class="song-grid">

        <div class="empty card">
          Caricamento archivio...
        </div>

      </div>

    </section>


    <!-- =========================
         MIXER
         ========================= -->

    <section
      id="mixer"
      class="hidden">


      <!-- TRANSPORT -->

      <section class="transport card">

        <div class="transport-buttons">

          <button
            id="playButton"
            class="button primary"
            type="button">
            ▶ Play
          </button>

          <button
            id="pauseButton"
            class="button"
            type="button">
            II Pause
          </button>

          <button
            id="stopButton"
            class="button"
            type="button">
            ■ Stop
          </button>

        </div>


        <div class="time-display">

          <span id="currentTime">
            0:00
          </span>

          <span>/</span>

          <span id="totalTime">
            0:00
          </span>

        </div>


        <input
          id="seekBar"
          class="seek"
          type="range"
          min="0"
          max="0"
          step="0.01"
          value="0">


        <div class="transport-options">


          <!-- SPEED -->

          <label>
            Velocità

            <select id="speed">

              <option value="0.5">50%</option>
              <option value="0.6">60%</option>
              <option value="0.7">70%</option>
              <option value="0.8">80%</option>
              <option value="0.9">90%</option>
              <option value="1" selected>100%</option>
              <option value="1.1">110%</option>
              <option value="1.2">120%</option>

            </select>

          </label>


          <!-- LOOP -->

          <div class="loop-buttons">

            <button
              id="setA"
              class="button"
              type="button">
              A
            </button>

            <button
              id="setB"
              class="button"
              type="button">
              B
            </button>

            <button
              id="clearLoop"
              class="button"
              type="button">
              Cancella A/B
            </button>

            <button
              id="loopButton"
              class="button"
              type="button">
              Loop OFF
            </button>

          </div>


          <div id="loopInfo">
            A: — &nbsp;&nbsp; B: —
          </div>

        </div>

      </section>


      <!-- TRACKS -->

      <section class="mixer-panel card">

        <div class="mixer-header">

          <h2>Stem</h2>

          <span id="trackCount">
            0 tracce
          </span>

        </div>


        <div id="tracks">

          <div class="empty">
            Nessuno stem caricato.
          </div>

        </div>

      </section>

    </section>


    <footer>

      <span>
        Band DAW · Web Audio API
      </span>

      <span id="audioSupport"></span>

    </footer>

  </main>


  <script src="app.js"></script>

</body>
</html>
